<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b2350">
<title>Pixel Stack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  :root { --bg: #2b2350; }
  html, body {
    margin: 0; height: 100%; background: var(--bg);
    overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body { display: flex; align-items: center; justify-content: center; }
  canvas {
    image-rendering: pixelated; image-rendering: crisp-edges;
    display: block; box-shadow: 0 0 0 4px #1a1530, 0 8px 32px #0008;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  // ---------- setup ----------
  const W = 180, H = 320, BH = 12, BASE_W = 84;
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  cv.width = W; cv.height = H;

  function fit() {
    const s = Math.max(1, Math.floor(Math.min(innerWidth / W, innerHeight / H) * 4) / 4);
    cv.style.width = W * s + 'px';
    cv.style.height = H * s + 'px';
  }
  addEventListener('resize', fit); fit();

  const OUTLINE = '#3b2a4a';
  const PALETTE = ['#ff8fab', '#ffc46b', '#fff07a', '#8be38b', '#7fd8ff', '#a99bff', '#ff9be8'];
  const SKY = [[255, 214, 232], [184, 224, 255], [150, 170, 240], [122, 108, 196], [43, 35, 80]];

  const shade = (hex, amt) => {
    const n = parseInt(hex.slice(1), 16);
    const c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.max(0, Math.min(255, Math.round(v + amt))));
    return `rgb(${c[0]},${c[1]},${c[2]})`;
  };

  let best = 0;
  try { best = +localStorage.getItem('pixel-stack-best') || 0; } catch (e) {}

  // ---------- sound (tiny chiptune blips) ----------
  let ac = null;
  function beep(freq, dur = 0.08, type = 'square', vol = 0.08, slide = 0) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur);
    } catch (e) {}
  }
  const NOTES = [523, 587, 659, 784, 880, 1047, 1175, 1319];

  // ---------- state ----------
  let state, stack, cur, debris, parts, combo, cam, camTarget, popText, shake, faceTimer, clouds, stars;

  function reset() {
    state = 'title';
    stack = [{ x: (W - BASE_W) / 2, w: BASE_W, color: PALETTE[0] }];
    combo = 0; cam = 0; camTarget = 0; shake = 0; faceTimer = 0;
    debris = []; parts = []; popText = null;
    spawn();
    clouds = Array.from({ length: 6 }, (_, i) => ({ x: Math.random() * W, y: 40 + i * 70, s: 0.1 + Math.random() * 0.15 }));
    stars = Array.from({ length: 50 }, () => ({ x: Math.random() * W, y: Math.random() * 1600, t: Math.random() * 6 }));
  }

  function spawn() {
    const top = stack[stack.length - 1];
    const lvl = stack.length;
    const fromLeft = lvl % 2 === 0;
    cur = {
      x: fromLeft ? -top.w : W,
      w: top.w,
      dir: fromLeft ? 1 : -1,
      speed: Math.min(1.1 + lvl * 0.045, 3.4),
      color: PALETTE[lvl % PALETTE.length],
    };
  }

  const score = () => stack.length - 1;
  const groundY = () => H - 40;
  const levelY = i => groundY() - (i + 1) * BH;

  // ---------- input ----------
  function tap() {
    if (state === 'title') { state = 'play'; beep(660, 0.1); beep(990, 0.12, 'square', 0.06); return; }
    if (state === 'over') { if (overTimer > 0.6) reset(); return; }
    place();
  }
  addEventListener('pointerdown', e => { e.preventDefault(); tap(); }, { passive: false });
  addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); tap(); } });

  function burst(x, y, n, color) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = 0.5 + Math.random() * 1.8;
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1, life: 1, color });
    }
  }

  function place() {
    const top = stack[stack.length - 1];
    const lvl = stack.length;
    const y = levelY(lvl);
    const left = Math.max(cur.x, top.x), right = Math.min(cur.x + cur.w, top.x + top.w);
    const overlap = right - left;

    if (overlap <= 0) {
      debris.push({ x: cur.x, y, w: cur.w, vy: 0, vx: cur.dir * 0.6, color: cur.color });
      gameOver();
      return;
    }

    if (Math.abs(cur.x - top.x) <= 2) {
      combo++;
      let w = top.w, x = top.x;
      if (combo >= 3 && w < BASE_W) { const g = Math.min(4, BASE_W - w); w += g; x -= g / 2; }
      stack.push({ x, w, color: cur.color });
      burst(x + w / 2, y + BH / 2, 14 + combo * 2, '#ffffff');
      popText = { text: combo >= 3 ? `PERFECT x${combo}` : 'PERFECT!', t: 1 };
      faceTimer = 0.6;
      beep(NOTES[Math.min(combo - 1, NOTES.length - 1)], 0.12);
      beep(NOTES[Math.min(combo - 1, NOTES.length - 1)] * 1.5, 0.1, 'triangle', 0.05);
    } else {
      combo = 0;
      stack.push({ x: left, w: overlap, color: cur.color });
      const cutX = cur.x < left ? cur.x : right;
      const cutW = cur.w - overlap;
      debris.push({ x: cutX, y, w: cutW, vy: 0, vx: cur.x < left ? -0.5 : 0.5, color: cur.color });
      beep(330 + Math.min(lvl, 30) * 8, 0.07);
      shake = 2;
    }

    const s = score();
    if (s > 9) camTarget = (s - 9) * BH;
    spawn();
  }

  let overTimer = 0, newBest = false;
  function gameOver() {
    state = 'over'; overTimer = 0; shake = 5;
    newBest = score() > best;
    if (newBest) { best = score(); try { localStorage.setItem('pixel-stack-best', best); } catch (e) {} }
    beep(440, 0.15, 'square', 0.08, -200);
    setTimeout(() => beep(220, 0.3, 'square', 0.08, -120), 150);
  }

  // ---------- drawing helpers ----------
  function block(x, y, w, color) {
    x = Math.round(x); y = Math.round(y); w = Math.round(w);
    if (w <= 0) return;
    ctx.fillStyle = OUTLINE; ctx.fillRect(x, y, w, BH);
    if (w <= 2) return;
    ctx.fillStyle = color; ctx.fillRect(x + 1, y + 1, w - 2, BH - 2);
    ctx.fillStyle = shade(color, 50); ctx.fillRect(x + 1, y + 1, w - 2, 2);
    ctx.fillStyle = shade(color, -45); ctx.fillRect(x + 1, y + BH - 3, w - 2, 2);
    if (w > 6) { ctx.fillStyle = '#fff'; ctx.fillRect(x + 2, y + 2, 2, 1); }
  }

  function face(x, y, w, mood) {
    if (w < 16) return;
    const cx = Math.round(x + w / 2), cy = Math.round(y) + 4;
    ctx.fillStyle = OUTLINE;
    if (mood === 'dead') {
      for (const ex of [cx - 6, cx + 4]) { ctx.fillRect(ex, cy, 1, 1); ctx.fillRect(ex + 1, cy + 1, 1, 1); ctx.fillRect(ex + 1, cy, 1, 1) ; ctx.fillRect(ex, cy + 1, 1, 1); }
      ctx.fillRect(cx - 2, cy + 4, 4, 1);
    } else if (mood === 'happy') {
      for (const ex of [cx - 6, cx + 4]) { ctx.fillRect(ex, cy + 1, 1, 1); ctx.fillRect(ex + 1, cy, 1, 1); ctx.fillRect(ex + 2, cy + 1, 1, 1); }
      ctx.fillRect(cx - 2, cy + 3, 4, 1); ctx.fillRect(cx - 1, cy + 4, 2, 1);
    } else {
      ctx.fillRect(cx - 6, cy, 2, 2); ctx.fillRect(cx + 4, cy, 2, 2);
      ctx.fillRect(cx - 1, cy + 4, 2, 1);
    }
    ctx.fillStyle = '#ff6f91';
    ctx.fillRect(cx - 9, cy + 3, 2, 1); ctx.fillRect(cx + 7, cy + 3, 2, 1);
  }

  function text(str, x, y, size = 8, color = '#fff', align = 'center') {
    ctx.font = `${size}px "Press Start 2P", monospace`;
    ctx.textAlign = align; ctx.textBaseline = 'top';
    ctx.fillStyle = OUTLINE;
    for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1], [1, 1]]) ctx.fillText(str, x + dx, y + dy);
    ctx.fillStyle = color; ctx.fillText(str, x, y);
  }

  function skyColor(h) {
    const t = Math.min(h / 60, 1) * (SKY.length - 1);
    const i = Math.min(Math.floor(t), SKY.length - 2), f = t - i;
    const c = SKY[i].map((v, k) => Math.round(v + (SKY[i + 1][k] - v) * f));
    return c;
  }

  // ---------- loop ----------
  let last = performance.now(), time = 0;
  function frame(now) {
    const dt = Math.min((now - last) / 16.667, 3); last = now; time += dt / 60;
    update(dt); draw();
    requestAnimationFrame(frame);
  }

  function update(dt) {
    if (state === 'play') {
      cur.x += cur.dir * cur.speed * dt;
      if (cur.x > W - cur.w + 20 && cur.dir > 0) cur.dir = -1;
      if (cur.x < -20 && cur.dir < 0) cur.dir = 1;
    }
    if (state === 'over') overTimer += dt / 60;
    cam += (camTarget - cam) * 0.1 * dt;
    for (const d of debris) { d.vy += 0.25 * dt; d.y += d.vy * dt; d.x += d.vx * dt; }
    debris = debris.filter(d => d.y < H + cam + 40);
    for (const p of parts) { p.vy += 0.06 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= 0.025 * dt; }
    parts = parts.filter(p => p.life > 0);
    if (popText) { popText.t -= 0.02 * dt; if (popText.t <= 0) popText = null; }
    shake = Math.max(0, shake - 0.3 * dt);
    faceTimer = Math.max(0, faceTimer - dt / 60);
    for (const c of clouds) { c.x += c.s * dt; if (c.x > W + 30) c.x = -40; }
  }

  function draw() {
    const h = score();
    const sc = skyColor(h);
    // sky: banded dither look
    for (let b = 0; b < 8; b++) {
      const k = 1 - b * 0.025;
      ctx.fillStyle = `rgb(${sc.map(v => Math.round(v * k)).join(',')})`;
      ctx.fillRect(0, b * (H / 8), W, H / 8 + 1);
    }

    ctx.save();
    const sx = shake ? Math.round((Math.random() - 0.5) * shake) : 0;
    const sy = shake ? Math.round((Math.random() - 0.5) * shake) : 0;
    ctx.translate(sx, Math.round(cam) + sy);

    // stars (fade in with height)
    const starA = Math.max(0, Math.min(1, (h - 25) / 25));
    if (starA > 0) {
      for (const s of stars) {
        const yy = s.y - 1400 + H;
        if (Math.sin(time * 3 + s.t) > -0.3) {
          ctx.globalAlpha = starA; ctx.fillStyle = '#fff8c8';
          ctx.fillRect(Math.round(s.x), Math.round(yy), 1, 1);
        }
      }
      ctx.globalAlpha = 1;
    }

    // clouds (parallax)
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    for (const c of clouds) {
      const yy = Math.round(c.y - cam * 0.5);
      const x = Math.round(c.x);
      ctx.fillRect(x, yy, 26, 6); ctx.fillRect(x + 5, yy - 4, 12, 4); ctx.fillRect(x + 14, yy - 2, 8, 2);
    }

    // ground
    const gy = groundY();
    ctx.fillStyle = '#6fcf6f'; ctx.fillRect(0, gy, W, 4);
    ctx.fillStyle = '#4aa35a'; ctx.fillRect(0, gy + 4, W, 2);
    ctx.fillStyle = '#b5835a'; ctx.fillRect(0, gy + 6, W, 60);
    ctx.fillStyle = '#9a6b47';
    for (let i = 0; i < W; i += 12) ctx.fillRect(i + ((i / 12) % 2) * 5, gy + 14 + ((i / 12) % 3) * 8, 3, 2);
    // flowers
    for (const fx of [14, 40, 128, 160]) {
      ctx.fillStyle = '#3f8f4f'; ctx.fillRect(fx, gy - 3, 1, 3);
      ctx.fillStyle = fx % 3 ? '#ff8fab' : '#fff07a'; ctx.fillRect(fx - 1, gy - 5, 3, 2);
    }

    // stack
    const topIdx = stack.length - 1;
    for (let i = 0; i < stack.length; i++) {
      const b = stack[i], y = levelY(i);
      if (y + cam > H + BH) continue;
      block(b.x, y, b.w, b.color);
    }
    // face on top block (or on moving block during play)
    const tb = stack[topIdx];
    if (state === 'over') face(tb.x, levelY(topIdx), tb.w, 'dead');
    else if (state !== 'play') face(tb.x, levelY(topIdx), tb.w, 'normal');

    // moving block
    if (state === 'play') {
      const y = levelY(stack.length);
      block(cur.x, y, cur.w, cur.color);
      face(cur.x, y, cur.w, faceTimer > 0 ? 'happy' : 'normal');
    }

    for (const d of debris) block(d.x, d.y, d.w, d.color);
    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color;
      ctx.fillRect(Math.round(p.x), Math.round(p.y), 2, 2);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // HUD
    if (state === 'play' || state === 'over') {
      text(String(h), W / 2, 18, 16, '#fff');
      text(`BEST ${best}`, W - 6, 6, 8, '#fff07a', 'right');
    }
    if (popText) {
      const y = 44 - (1 - popText.t) * 10;
      ctx.globalAlpha = Math.min(1, popText.t * 2);
      text(popText.text, W / 2, Math.round(y), 8, '#fff07a');
      ctx.globalAlpha = 1;
    }

    if (state === 'title') {
      const bob = Math.round(Math.sin(time * 3) * 2);
      text('PIXEL', W / 2, 60 + bob, 16, '#ff8fab');
      text('STACK', W / 2, 80 + bob, 16, '#7fd8ff');
      if (Math.floor(time * 2) % 2 === 0) text('TAP TO START', W / 2, 130, 8, '#fff');
      text(`BEST ${best}`, W / 2, 150, 8, '#fff07a');
    }
    if (state === 'over') {
      ctx.fillStyle = 'rgba(43,35,80,0.55)'; ctx.fillRect(0, 96, W, 80);
      text('GAME OVER', W / 2, 108, 12, '#ff8fab');
      text(newBest ? 'NEW BEST!' : `BEST ${best}`, W / 2, 132, 8, '#fff07a');
      if (overTimer > 0.6 && Math.floor(time * 2) % 2 === 0) text('TAP TO RETRY', W / 2, 152, 8, '#fff');
    }
  }

  window.__pixelStack = { get: () => ({ state, stack, cur }) };
  reset();
  (document.fonts ? document.fonts.load('8px "Press Start 2P"') : Promise.resolve())
    .catch(() => {}).finally(() => requestAnimationFrame(frame));
})();
</script>
</body>
</html>
