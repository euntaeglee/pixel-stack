<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b2350">
<title>Pixel Stack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  :root { --bg: #2b2350; }
  html, body {
    margin: 0; height: 100%; background: var(--bg);
    overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body { display: flex; align-items: center; justify-content: center; }
  canvas {
    image-rendering: pixelated; image-rendering: crisp-edges;
    display: block; box-shadow: 0 0 0 4px #1a1530, 0 8px 32px #0008;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  // ---------- setup ----------
  const W = 180, H = 320, BH = 12, BASE_W = 84;
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  cv.width = W; cv.height = H;

  function fit() {
    const s = Math.max(1, Math.floor(Math.min(innerWidth / W, innerHeight / H) * 4) / 4);
    cv.style.width = W * s + 'px';
    cv.style.height = H * s + 'px';
  }
  addEventListener('resize', fit); fit();

  const OUTLINE = '#3b2a4a';
  const PALETTE = ['#ff8fab', '#ffc46b', '#fff07a', '#8be38b', '#7fd8ff', '#a99bff', '#ff9be8'];
  const SKY = [[255, 214, 232], [184, 224, 255], [150, 170, 240], [122, 108, 196], [43, 35, 80]];

  const shade = (hex, amt) => {
    const n = parseInt(hex.slice(1), 16);
    const c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.max(0, Math.min(255, Math.round(v + amt))));
    return `rgb(${c[0]},${c[1]},${c[2]})`;
  };

  let best = 0;
  try { best = +localStorage.getItem('pixel-stack-best') || 0; } catch (e) {}

  // ---------- sound (tiny chiptune blips) ----------
  let ac = null;
  function beep(freq, dur = 0.08, type = 'square', vol = 0.08, slide = 0) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur);
    } catch (e) {}
  }
  const NOTES = [523, 587, 659, 784, 880, 1047, 1175, 1319];

  // filtered white-noise burst: crunchy slice / thud sounds
  let noiseBuf = null;
  function crunch(dur = 0.12, vol = 0.12, freq = 2400) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (!noiseBuf) {
        noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(), t = ac.currentTime;
      s.buffer = noiseBuf;
      f.type = 'lowpass'; f.frequency.setValueAtTime(freq, t);
      f.frequency.exponentialRampToValueAtTime(120, t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f).connect(g).connect(ac.destination); s.start(t); s.stop(t + dur);
    } catch (e) {}
  }
  const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

  // ---------- state ----------
  let state, stack, cur, debris, parts, combo, cam, camTarget, popText, shake, faceTimer, clouds, stars;
  let rings, slashes, flash, freeze, kick, wave;

  function reset() {
    state = 'title';
    stack = [{ x: (W - BASE_W) / 2, w: BASE_W, color: PALETTE[0] }];
    combo = 0; cam = 0; camTarget = 0; shake = 0; faceTimer = 0;
    debris = []; parts = []; popText = null;
    rings = []; slashes = []; flash = null; freeze = 0; kick = 0; wave = null;
    spawn();
    clouds = Array.from({ length: 6 }, (_, i) => ({ x: Math.random() * W, y: 40 + i * 70, s: 0.1 + Math.random() * 0.15 }));
    stars = Array.from({ length: 50 }, () => ({ x: Math.random() * W, y: Math.random() * 1600, t: Math.random() * 6 }));
  }

  function spawn() {
    const top = stack[stack.length - 1];
    const lvl = stack.length;
    const fromLeft = lvl % 2 === 0;
    cur = {
      x: fromLeft ? -top.w : W,
      w: top.w,
      dir: fromLeft ? 1 : -1,
      speed: Math.min(1.1 + lvl * 0.045, 3.4),
      color: PALETTE[lvl % PALETTE.length],
    };
  }

  const score = () => stack.length - 1;
  const groundY = () => H - 40;
  const levelY = i => groundY() - (i + 1) * BH;

  // ---------- input ----------
  function tap() {
    if (state === 'title') { state = 'play'; beep(660, 0.1); beep(990, 0.12, 'square', 0.06); return; }
    if (state === 'over') { if (overTimer > 0.6) reset(); return; }
    place();
  }
  addEventListener('pointerdown', e => { e.preventDefault(); tap(); }, { passive: false });
  addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); tap(); } });

  function burst(x, y, n, color, kind = 'dot', speed = 1.8) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = 0.5 + Math.random() * speed;
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1, life: 1, color, kind, g: 0.06, decay: 0.025 });
    }
  }

  function slab(x, y, w, color, dir, pop) {
    debris.push({ x, y, w, color, vx: dir * (0.5 + Math.random() * 0.6), vy: -pop,
      rot: 0, vr: dir * (0.05 + Math.random() * 0.05) });
  }

  function place() {
    const top = stack[stack.length - 1];
    const lvl = stack.length;
    const y = levelY(lvl);
    const left = Math.max(cur.x, top.x), right = Math.min(cur.x + cur.w, top.x + top.w);
    const overlap = right - left;

    if (overlap <= 0) {
      slab(cur.x, y, cur.w, cur.color, cur.dir, 0.8);
      gameOver();
      return;
    }

    if (Math.abs(cur.x - top.x) <= 2) {
      combo++;
      const big = Math.min(combo, 6);
      let w = top.w, x = top.x;
      if (combo >= 3 && w < BASE_W) { const g = Math.min(4, BASE_W - w); w += g; x -= g / 2; }
      stack.push({ x, w, color: cur.color, flash: 1 });
      // sparkle burst + side jets shooting out of both edges
      burst(x + w / 2, y + BH / 2, 10 + big * 4, '#ffffff', 'star', 1.6 + big * 0.25);
      for (let i = 0; i < 6 + big * 2; i++) {
        for (const [ex, d] of [[x, -1], [x + w, 1]]) {
          parts.push({ x: ex, y: y + 2 + Math.random() * (BH - 4), vx: d * (1.5 + Math.random() * 2.5),
            vy: -Math.random() * 0.8, life: 1, color: i % 2 ? '#fff07a' : shade(cur.color, 60), kind: 'dot', g: 0.02, decay: 0.035 });
        }
      }
      rings.push({ x, y, w, t: 0, color: '#ffffff' });
      if (combo >= 3) rings.push({ x, y, w, t: -0.15, color: '#fff07a' });
      if (combo >= 5) rings.push({ x, y, w, t: -0.3, color: '#ff8fab' });
      flash = { a: 0.2 + big * 0.05, c: '255,255,255' };
      freeze = 0.05 + big * 0.012;
      kick = 2 + big * 0.5;
      wave = { t: 0, amp: 1.5 + big * 0.4 };
      popText = { text: combo >= 3 ? `PERFECT x${combo}` : 'PERFECT!', t: 1, big: combo >= 3 };
      faceTimer = 0.6;
      const n = NOTES[Math.min(combo - 1, NOTES.length - 1)];
      beep(n, 0.12); beep(n * 1.5, 0.1, 'triangle', 0.05);
      setTimeout(() => beep(n * 2, 0.1, 'square', 0.05), 70);
      if (combo >= 3) setTimeout(() => beep(n * 3, 0.14, 'triangle', 0.05), 140);
      buzz(10 + big * 4);
    } else {
      combo = 0;
      stack.push({ x: left, w: overlap, color: cur.color, flash: 0.5 });
      const dir = cur.x < left ? -1 : 1;
      const cutX = dir < 0 ? cur.x : right;
      const cutW = cur.w - overlap;
      const edgeX = dir < 0 ? left : right;
      slab(cutX, y, cutW, cur.color, dir, 1 + Math.min(cutW / 20, 1.2));
      // bright slash line at the cut edge + chips flying off
      slashes.push({ x: edgeX, y, t: 1 });
      for (let i = 0; i < 6 + Math.min(cutW / 3, 10); i++) {
        parts.push({ x: edgeX, y: y + Math.random() * BH, vx: dir * (0.4 + Math.random() * 2.2),
          vy: -0.5 - Math.random() * 2, life: 1, color: i % 3 ? cur.color : '#ffffff', kind: 'chip', g: 0.15, decay: 0.022 });
      }
      shake = 2.5 + Math.min(cutW / 6, 4);
      freeze = 0.03;
      kick = 1;
      beep(330 + Math.min(lvl, 30) * 8, 0.07);
      crunch(0.1 + Math.min(cutW / 200, 0.1), 0.14);
      buzz(20 + Math.min(cutW, 30));
    }

    const s = score();
    if (s > 9) camTarget = (s - 9) * BH;
    spawn();
  }

  let overTimer = 0, newBest = false;
  function gameOver() {
    state = 'over'; overTimer = 0; shake = 7; freeze = 0.12; kick = 3;
    flash = { a: 0.45, c: '255,90,130' };
    newBest = score() > best;
    if (newBest) { best = score(); try { localStorage.setItem('pixel-stack-best', best); } catch (e) {} }
    crunch(0.25, 0.16, 1200);
    buzz([60, 40, 90]);
    beep(440, 0.15, 'square', 0.08, -200);
    setTimeout(() => beep(220, 0.3, 'square', 0.08, -120), 150);
  }

  // ---------- drawing helpers ----------
  function block(x, y, w, color, fl = 0) {
    x = Math.round(x); y = Math.round(y); w = Math.round(w);
    if (w <= 0) return;
    ctx.fillStyle = OUTLINE; ctx.fillRect(x, y, w, BH);
    if (w <= 2) return;
    ctx.fillStyle = color; ctx.fillRect(x + 1, y + 1, w - 2, BH - 2);
    ctx.fillStyle = shade(color, 50); ctx.fillRect(x + 1, y + 1, w - 2, 2);
    ctx.fillStyle = shade(color, -45); ctx.fillRect(x + 1, y + BH - 3, w - 2, 2);
    if (w > 6) { ctx.fillStyle = '#fff'; ctx.fillRect(x + 2, y + 2, 2, 1); }
    if (fl > 0) {
      ctx.globalAlpha = Math.min(1, fl); ctx.fillStyle = '#fff';
      ctx.fillRect(x + 1, y + 1, w - 2, BH - 2); ctx.globalAlpha = 1;
    }
  }

  function face(x, y, w, mood) {
    if (w < 16) return;
    const cx = Math.round(x + w / 2), cy = Math.round(y) + 4;
    ctx.fillStyle = OUTLINE;
    if (mood === 'dead') {
      for (const ex of [cx - 6, cx + 4]) { ctx.fillRect(ex, cy, 1, 1); ctx.fillRect(ex + 1, cy + 1, 1, 1); ctx.fillRect(ex + 1, cy, 1, 1) ; ctx.fillRect(ex, cy + 1, 1, 1); }
      ctx.fillRect(cx - 2, cy + 4, 4, 1);
    } else if (mood === 'happy') {
      for (const ex of [cx - 6, cx + 4]) { ctx.fillRect(ex, cy + 1, 1, 1); ctx.fillRect(ex + 1, cy, 1, 1); ctx.fillRect(ex + 2, cy + 1, 1, 1); }
      ctx.fillRect(cx - 2, cy + 3, 4, 1); ctx.fillRect(cx - 1, cy + 4, 2, 1);
    } else {
      ctx.fillRect(cx - 6, cy, 2, 2); ctx.fillRect(cx + 4, cy, 2, 2);
      ctx.fillRect(cx - 1, cy + 4, 2, 1);
    }
    ctx.fillStyle = '#ff6f91';
    ctx.fillRect(cx - 9, cy + 3, 2, 1); ctx.fillRect(cx + 7, cy + 3, 2, 1);
  }

  function text(str, x, y, size = 8, color = '#fff', align = 'center') {
    ctx.font = `${size}px "Press Start 2P", monospace`;
    ctx.textAlign = align; ctx.textBaseline = 'top';
    ctx.fillStyle = OUTLINE;
    for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1], [1, 1]]) ctx.fillText(str, x + dx, y + dy);
    ctx.fillStyle = color; ctx.fillText(str, x, y);
  }

  function skyColor(h) {
    const t = Math.min(h / 60, 1) * (SKY.length - 1);
    const i = Math.min(Math.floor(t), SKY.length - 2), f = t - i;
    const c = SKY[i].map((v, k) => Math.round(v + (SKY[i + 1][k] - v) * f));
    return c;
  }

  // ---------- loop ----------
  let last = performance.now(), time = 0;
  function frame(now) {
    const dt = Math.min((now - last) / 16.667, 3); last = now; time += dt / 60;
    // hit-stop: freeze the world for a few frames on impact
    if (freeze > 0) freeze -= dt / 60; else update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  function update(dt) {
    if (state === 'play') {
      cur.x += cur.dir * cur.speed * dt;
      if (cur.x > W - cur.w + 20 && cur.dir > 0) cur.dir = -1;
      if (cur.x < -20 && cur.dir < 0) cur.dir = 1;
    }
    if (state === 'over') overTimer += dt / 60;
    cam += (camTarget - cam) * 0.1 * dt;
    const gy = groundY();
    for (const d of debris) {
      d.vy += 0.22 * dt; d.y += d.vy * dt; d.x += d.vx * dt; d.rot += d.vr * dt;
      // hits the ground: shatter into pixel chunks
      if (d.vy > 0 && d.y + BH >= gy) {
        d.dead = true;
        for (let cx = 0; cx < d.w; cx += 4) {
          parts.push({ x: d.x + cx, y: gy - 3, vx: (Math.random() - 0.5) * 2.5 + d.vx * 0.5,
            vy: -1 - Math.random() * 2.2, life: 1, color: d.color, kind: 'chunk', g: 0.18, decay: 0.02 });
        }
        burst(d.x + d.w / 2, gy - 2, 6, 'rgba(255,255,255,0.8)', 'dot', 1.2);
        if (gy + cam < H) { shake = Math.max(shake, 2); crunch(0.14, 0.1, 600); }
      }
    }
    debris = debris.filter(d => !d.dead && d.y < H - cam + 40);
    for (const p of parts) { p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= p.decay * dt; }
    parts = parts.filter(p => p.life > 0);
    for (const r of rings) r.t += 0.045 * dt;
    rings = rings.filter(r => r.t < 1);
    for (const s of slashes) s.t -= 0.09 * dt;
    slashes = slashes.filter(s => s.t > 0);
    for (let i = Math.max(0, stack.length - 4); i < stack.length; i++) if (stack[i].flash) stack[i].flash = Math.max(0, stack[i].flash - 0.07 * dt);
    if (flash) { flash.a -= 0.03 * dt; if (flash.a <= 0) flash = null; }
    if (wave) { wave.t += dt / 60; if (wave.t > 0.6) wave = null; }
    kick = Math.max(0, kick - 0.35 * dt);
    if (popText) { popText.t -= 0.02 * dt; if (popText.t <= 0) popText = null; }
    shake = Math.max(0, shake - 0.3 * dt);
    faceTimer = Math.max(0, faceTimer - dt / 60);
    for (const c of clouds) { c.x += c.s * dt; if (c.x > W + 30) c.x = -40; }
  }

  function draw() {
    const h = score();
    const sc = skyColor(h);
    // sky: banded dither look
    for (let b = 0; b < 8; b++) {
      const k = 1 - b * 0.025;
      ctx.fillStyle = `rgb(${sc.map(v => Math.round(v * k)).join(',')})`;
      ctx.fillRect(0, b * (H / 8), W, H / 8 + 1);
    }

    ctx.save();
    const sx = shake ? Math.round((Math.random() - 0.5) * shake) : 0;
    const sy = shake ? Math.round((Math.random() - 0.5) * shake) : 0;
    ctx.translate(sx, Math.round(cam + kick) + sy);

    // stars (fade in with height)
    const starA = Math.max(0, Math.min(1, (h - 25) / 25));
    if (starA > 0) {
      for (const s of stars) {
        const yy = s.y - 1400 + H;
        if (Math.sin(time * 3 + s.t) > -0.3) {
          ctx.globalAlpha = starA; ctx.fillStyle = '#fff8c8';
          ctx.fillRect(Math.round(s.x), Math.round(yy), 1, 1);
        }
      }
      ctx.globalAlpha = 1;
    }

    // clouds (parallax)
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    for (const c of clouds) {
      const yy = Math.round(c.y - cam * 0.5);
      const x = Math.round(c.x);
      ctx.fillRect(x, yy, 26, 6); ctx.fillRect(x + 5, yy - 4, 12, 4); ctx.fillRect(x + 14, yy - 2, 8, 2);
    }

    // ground
    const gy = groundY();
    ctx.fillStyle = '#6fcf6f'; ctx.fillRect(0, gy, W, 4);
    ctx.fillStyle = '#4aa35a'; ctx.fillRect(0, gy + 4, W, 2);
    ctx.fillStyle = '#b5835a'; ctx.fillRect(0, gy + 6, W, 60);
    ctx.fillStyle = '#9a6b47';
    for (let i = 0; i < W; i += 12) ctx.fillRect(i + ((i / 12) % 2) * 5, gy + 14 + ((i / 12) % 3) * 8, 3, 2);
    // flowers
    for (const fx of [14, 40, 128, 160]) {
      ctx.fillStyle = '#3f8f4f'; ctx.fillRect(fx, gy - 3, 1, 3);
      ctx.fillStyle = fx % 3 ? '#ff8fab' : '#fff07a'; ctx.fillRect(fx - 1, gy - 5, 3, 2);
    }

    // stack
    const topIdx = stack.length - 1;
    for (let i = 0; i < stack.length; i++) {
      const b = stack[i];
      let y = levelY(i);
      if (y + cam > H + BH) continue;
      // impact wave travelling down the tower on a perfect
      if (wave) {
        const d = topIdx - i, p = wave.t - d * 0.035;
        if (d < 8 && p > 0 && p < 0.18) y += Math.round(Math.sin(p / 0.18 * Math.PI) * wave.amp * (1 - d / 8));
      }
      block(b.x, y, b.w, b.color, b.flash || 0);
    }
    // expanding shockwave outlines
    for (const r of rings) {
      if (r.t < 0) continue;
      const e = Math.round((1 - (1 - r.t) * (1 - r.t)) * 18), th = r.t < 0.4 ? 2 : 1;
      const rx = Math.round(r.x) - e, ry = Math.round(r.y) - e, rw = Math.round(r.w) + e * 2, rh = BH + e * 2;
      ctx.globalAlpha = 1 - r.t; ctx.fillStyle = r.color;
      ctx.fillRect(rx, ry, rw, th); ctx.fillRect(rx, ry + rh - th, rw, th);
      ctx.fillRect(rx, ry, th, rh); ctx.fillRect(rx + rw - th, ry, th, rh);
    }
    ctx.globalAlpha = 1;
    // slice flash at the cut edge
    for (const s of slashes) {
      ctx.globalAlpha = s.t; ctx.fillStyle = '#fff';
      const ext = Math.round(4 + (1 - s.t) * 10);
      ctx.fillRect(Math.round(s.x) - 1, Math.round(s.y) - ext, 2, BH + ext * 2);
      ctx.fillStyle = '#fff07a';
      ctx.fillRect(Math.round(s.x) - 2, Math.round(s.y) + 2, 4, BH - 4);
    }
    ctx.globalAlpha = 1;
    // face on top block (or on moving block during play)
    const tb = stack[topIdx];
    if (state === 'over') face(tb.x, levelY(topIdx), tb.w, 'dead');
    else if (state !== 'play') face(tb.x, levelY(topIdx), tb.w, 'normal');

    // moving block
    if (state === 'play') {
      const y = levelY(stack.length);
      block(cur.x, y, cur.w, cur.color);
      face(cur.x, y, cur.w, faceTimer > 0 ? 'happy' : 'normal');
    }

    for (const d of debris) {
      ctx.save();
      ctx.translate(Math.round(d.x + d.w / 2), Math.round(d.y + BH / 2));
      ctx.rotate(d.rot);
      block(-d.w / 2, -BH / 2, d.w, d.color);
      ctx.restore();
    }
    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.5)); ctx.fillStyle = p.color;
      const x = Math.round(p.x), y = Math.round(p.y);
      if (p.kind === 'star' && p.life > 0.4) { ctx.fillRect(x - 1, y, 3, 1); ctx.fillRect(x, y - 1, 1, 3); }
      else if (p.kind === 'chunk') { ctx.fillRect(x, y, 3, 3); ctx.fillStyle = OUTLINE; ctx.fillRect(x, y + 3, 3, 1); }
      else ctx.fillRect(x, y, 2, 2);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    if (flash) { ctx.fillStyle = `rgba(${flash.c},${Math.max(0, flash.a)})`; ctx.fillRect(0, 0, W, H); }

    // HUD
    if (state === 'play' || state === 'over') {
      text(String(h), W / 2, 18, 16, '#fff');
      text(`BEST ${best}`, W - 6, 6, 8, '#fff07a', 'right');
    }
    if (popText) {
      // pop in big, settle, then float up and fade
      const y = 44 - (1 - popText.t) * 10;
      const s = popText.t > 0.8 ? 1 + (popText.t - 0.8) / 0.2 * 0.9 : 1;
      const col = popText.big ? PALETTE[Math.floor(time * 14) % PALETTE.length] : '#fff07a';
      ctx.save();
      ctx.globalAlpha = Math.min(1, popText.t * 2);
      ctx.translate(W / 2, Math.round(y) + 4); ctx.scale(s, s);
      text(popText.text, 0, -4, popText.big ? 10 : 8, col);
      ctx.restore();
    }

    if (state === 'title') {
      const bob = Math.round(Math.sin(time * 3) * 2);
      text('PIXEL', W / 2, 60 + bob, 16, '#ff8fab');
      text('STACK', W / 2, 80 + bob, 16, '#7fd8ff');
      if (Math.floor(time * 2) % 2 === 0) text('TAP TO START', W / 2, 130, 8, '#fff');
      text(`BEST ${best}`, W / 2, 150, 8, '#fff07a');
    }
    if (state === 'over') {
      ctx.fillStyle = 'rgba(43,35,80,0.55)'; ctx.fillRect(0, 96, W, 80);
      text('GAME OVER', W / 2, 108, 12, '#ff8fab');
      text(newBest ? 'NEW BEST!' : `BEST ${best}`, W / 2, 132, 8, '#fff07a');
      if (overTimer > 0.6 && Math.floor(time * 2) % 2 === 0) text('TAP TO RETRY', W / 2, 152, 8, '#fff');
    }
  }

  window.__pixelStack = { get: () => ({ state, stack, cur }) };
  reset();
  (document.fonts ? document.fonts.load('8px "Press Start 2P"') : Promise.resolve())
    .catch(() => {}).finally(() => requestAnimationFrame(frame));
})();
</script>
</body>
</html>
